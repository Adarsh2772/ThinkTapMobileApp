<style>
    body {
      background-color: #FAFAFA;
      -webkit-font-smoothing: antialiased;

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;

    @keyframes pulse-ring {
      0% { transform: scale(.33); opacity: 0; }
      50% { opacity: 0.2; }
      100% { transform: scale(1); opacity: 0; }
    }

    @keyframes pulse-center {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .pulse-animation {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 120px;
      height: 120px;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 1px solid #111111;
      border-radius: 50%;
      animation: pulse-ring 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    .pulse-ring:nth-child(2) {
      animation-delay: 1s;
    }

    .pulse-ring:nth-child(3) {
      animation-delay: 2s;
    }

    .pulse-core {
      width: 12px;
      height: 12px;
      background-color: #111111;
      border-radius: 50%;
      animation: pulse-center 2s ease-in-out infinite;
      z-index: 2;
    }

    .loading-bar-container {
      width: 180px;
      height: 2px;
      background-color: #EAEAEA;
      overflow: hidden;

    }

    .loading-bar-progress {
      width: 40%;

      background-color: #111111;
      animation: progress-slide 2s infinite ease-in-out;
    }

    @keyframes progress-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }

    .fade-in-up {
      animation: fadeInUp 0.8s ease-out forwards;
    }

    @keyframes fadeInUp {

<body class="font-body-md text-on-background flex flex-col items-center justify-center min-h-screen p-container-margin overflow-hidden">
<!-- Main Canvas -->
<main class="flex flex-col items-center justify-center w-full max-w-md text-center space-y-stack-lg">
<!-- Central Visual: Sparkle/Pulse Animation -->
<div aria-hidden="true" class="pulse-animation mb-stack-md">
<div class="pulse-ring"></div>
<div class="pulse-ring"></div>
<div class="pulse-ring"></div>
<div class="pulse-core"></div>
<!-- Subtle Floating Icon Representation -->
<span class="material-symbols-outlined absolute text-primary opacity-20" style="font-size: 40px; transform: translate(-30px, -30px);">auto_awesome</span>
<span class="material-symbols-outlined absolute text-primary opacity-10" style="font-size: 24px; transform: translate(35px, 25px);">lightbulb</span>
</div>
<!-- Text Messaging Content -->
<div class="space-y-stack-sm fade-in-up" style="animation-delay: 0.2s;">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">
        Organizing your idea...
      </h1>
<p class="font-body-md text-on-surface-variant max-w-[280px] mx-auto">
        AI is generating titles, tags, and a summary.
      </p>
</div>
<!-- Minimal Progress Indicator -->
<div class="loading-bar-container mt-stack-md fade-in-up" style="animation-delay: 0.4s;">
<div class="loading-bar-progress"></div>
</div>
<!-- Processing Steps (Simulated micro-status) -->
<div class="flex flex-col items-center space-y-2 mt-stack-lg fade-in-up opacity-0" style="animation-delay: 0.6s; animation-fill-mode: forwards;">
<div class="flex items-center space-y-0 space-x-2 transition-opacity duration-500" id="step-1">
<span class="material-symbols-outlined text-[14px] text-on-surface-variant">check_circle</span>
<span class="font-label-md text-label-md text-on-surface-variant">Analyzing transcript</span>
</div>
<div class="flex items-center space-y-0 space-x-2 transition-opacity duration-500 opacity-40" id="step-2">
<span class="material-symbols-outlined text-[14px] text-on-surface-variant">circle</span>
<span class="font-label-md text-label-md text-on-surface-variant">Extracting key themes</span>
</div>
</div>
</main>
<!-- Decorative Atmospheric Elements -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<!-- Subtle Gradient Aura -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-secondary-container/5 rounded-full blur-[120px]"></div>
</div>
<script>
    // Micro-interaction: Update text status over time
    const steps = [
      { id: 'step-1', text: 'Analyzing transcript', done: true },
      { id: 'step-2', text: 'Extracting key themes', done: false },
      { id: 'step-3', text: 'Drafting summary', done: false }
    ];

    let currentStep = 1;

    const updateSteps = () => {
      const step2 = document.getElementById('step-2');
      if (!step2) return;

      if (currentStep === 1) {
        step2.classList.remove('opacity-40');
        step2.querySelector('.material-symbols-outlined').innerText = 'sync';
        step2.querySelector('.material-symbols-outlined').classList.add('animate-spin');
        currentStep = 2;
      } else if (currentStep === 2) {
        step2.querySelector('.material-symbols-outlined').innerText = 'check_circle';
        step2.querySelector('.material-symbols-outlined').classList.remove('animate-spin');
        
        // Create new step dynamically to show progression
        const step3 = document.createElement('div');
        step3.className = 'flex items-center space-y-0 space-x-2 transition-opacity duration-500 fade-in-up';
        step3.innerHTML = `
          <span class="material-symbols-outlined text-[14px] text-on-surface-variant animate-spin">sync</span>
          <span class="font-label-md text-label-md text-on-surface-variant">Drafting summary</span>
        `;
        step2.parentNode.appendChild(step3);
        currentStep = 3;
      }
    };

    // Trigger step updates every 2.5 seconds
    setTimeout(updateSteps, 2500);
    setTimeout(updateSteps, 5500);
    
    // Accessibility: Prevent navigation during this critical state
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        // Optional: show a "cancel" prompt or ignore
      }
    });
  </script>
